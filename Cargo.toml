[workspace]
members = [
    "crates/cubikan-backend",
    "crates/cubikan-cli",
    "crates/cubikan-core",
    "crates/cubikan-local",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/crussella0129/CubiKan"

[workspace.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
